#       read only: false
#     ntacl:
#       aces:
#         - {trustee: 'EXAMPLE\File Admins', rights: full}
#         - {trustee: 'EXAMPLE\File Writers', rights: modify}
#         - {trustee: 'EXAMPLE\File Readers', rights: read_execute}
#       folders:
