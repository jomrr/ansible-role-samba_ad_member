#       - {etype: group, permissions: '---', default: true}
#       - {etype: group, entity: 'EXAMPLE\File Readers', permissions: r-x, default: true}
#       - {etype: group, entity: 'EXAMPLE\File Writers', permissions: rwx, default: true}
#       - {etype: mask, permissions: rwx, default: true}
#       - {etype: other, permissions: '---', default: true}
