---
# role: samba_ad_member
# file: defaults/main.yml

# Required AD DNS domain / Kerberos realm; immutable after joining.
# samba_ad_member_realm: AD.EXAMPLE.COM

# Required AD NetBIOS domain name; immutable after joining.
# samba_ad_member_domain: EXAMPLE

# Required DNS hostname of an existing DC used for joining.
# samba_ad_member_server: dc1.ad.example.com

# Optional OU DN for new computer accounts; omitted or empty uses the domain's default computers container.
# samba_ad_member_computer_ou: OU=Servers,DC=ad,DC=example,DC=com

# Domain account delegated permission to join computers.
samba_ad_member_join_username: Administrator

# Join secret; required for an initial or forced join.
# samba_ad_member_join_password: "{{ vault_samba_join_password }}"

# Join authentication: required (Kerberos only) or desired (NTLM fallback).
samba_ad_member_join_use_kerberos: required

# Rejoin on every run; enable only for deliberate trust repair.
samba_ad_member_force_join: false

# Stable member computer name, at most 15 characters.
samba_ad_member_netbios_name: '{{ ansible_facts.hostname | upper }}'

# Domain backend: ad (RFC2307), rid, or autorid. Changes require ID migration.
samba_ad_member_idmap_backend: ad

# Inclusive ad/rid domain range; RFC2307 IDs must already be inside it.
# Keep all ranges disjoint from local and subordinate UID/GID allocations.
samba_ad_member_idmap_range: 70000-99999

# Disjoint writable tdb range for BUILTIN and unmapped domains with ad/rid.
samba_ad_member_idmap_default_range: 65536-69999

# Autorid pool, replacing both ranges above; incomplete trailing blocks are unused.
samba_ad_member_idmap_autorid_range: 65536-99999

# IDs per autorid block, at least 2000; the pool must fit at least two whole blocks.
samba_ad_member_idmap_autorid_rangesize: 10000

# Read the primary GID from the AD user's gidNumber instead of primaryGroupID.
samba_ad_member_ad_unix_primary_group: true

# Read unixHomeDirectory and loginShell from AD with the ad backend.
samba_ad_member_ad_unix_nss_info: true

# Allow unqualified domain names in NSS; false retains DOMAIN\name.
samba_ad_member_winbind_use_default_domain: false

# Fallback home path; Samba substitutions are supported, directories are not created.
samba_ad_member_template_homedir: /home/%D/%U

# Fallback login shell for accounts without an AD loginShell.
samba_ad_member_template_shell: /bin/bash

# System keytab to initialize and protect; passed to jomrr.krb5 as the library default.
samba_ad_member_keytab_path: /etc/krb5.keytab

# Native pam_winbind options; the cache type and disabled module home creation are role-owned.
samba_ad_member_pam_winbind_options:
  krb5_auth: true
  cached_login: true
  # require_membership_of: S-1-5-21-111111111-222222222-333333333-1100  # Group SIDs, comma-separated.

# Native global options; role-owned identity/idmap settings take precedence.
# Values are scalars; Samba lists are strings. Replacing this dictionary replaces its defaults.
samba_ad_member_global_options:
  kerberos method: secrets and keytab
  apply group policies: true
  server min protocol: SMB3
  server signing: mandatory
  server smb encrypt: required
  client signing: required
  map to guest: Never
  restrict anonymous: 2
  disable netbios: true
  smb ports: '445'
  load printers: false
  disable spoolss: true
  printing: bsd
  printcap name: /dev/null
  logging: file
  log file: /var/log/samba/log.samba
  log level: '1 auth_audit:4'
  max log size: 10000
  winbind refresh tickets: true
  winbind offline logon: true
  winbind enum users: false
  winbind enum groups: false

# Native options inherited by every share; item options merge over this dictionary.
# A VFS override replaces the entire stack. See README.md and docs/security.md for details.
# Keep streams_xattr before recycle; recycling discards ADS, including Zone.Identifier.
samba_ad_member_share_options:
  browseable: true
  read only: true
  guest ok: false
  inherit acls: true
  map acl inherit: true
  store dos attributes: true
  vfs objects: full_audit acl_xattr streams_xattr recycle
  acl_xattr:ignore system acls: false
  recycle:repository: .recycle
  recycle:keeptree: true
  recycle:versions: true
  recycle:directory_mode: '0770'
  recycle:subdir_mode: '0770'
  full_audit:prefix: 'samba_audit|%u|%I|%S'
  full_audit:success: connect disconnect create_file mkdirat renameat unlinkat fset_nt_acl
  full_audit:failure: all
  full_audit:syslog: false

# Default owner for POSIX-managed share roots; local/qualified AD name or numeric UID.
samba_ad_member_share_owner: root

# Default group for POSIX-managed share roots; local/qualified AD name or numeric GID.
samba_ad_member_share_group: root

# Non-recursive POSIX share root mode; group bits also set the POSIX access ACL mask.
samba_ad_member_share_mode: '0770'

# Default POSIX share root ACLs; item acls replaces this list. Unlisted existing ACLs are preserved.
# Fields: etype (user/group/mask/other), entity, permissions, default (bool), state (present/absent; default present).
# default: true declares inheritance; acls: [] applies no entries, it does not clear ACLs.
samba_ad_member_share_acls: []

# Persistent SELinux type for share directory trees on SELinux-enabled hosts.
samba_ad_member_share_setype: samba_share_t

# Shares require name and absolute path; removing entries preserves stored data.
# The role manages the static path before the first component containing a Samba substitution.
# Optional root fields: owner, group, mode, acls, setype; options holds Samba settings.
# ntacl replaces owner/group/mode/acls; see README.md for NTACL inheritance options.
samba_ad_member_shares: []
# Examples below assume existing RFC2307 users/groups in the configured ID range.
# samba_ad_member_shares:
#   # Roaming profiles: \\fileserver\profiles\%USERNAME% (AD/GPO path, without version suffix).
#   # Configure Windows root ACLs separately; Unix Admins needs an RFC2307 gidNumber.
#   # See README.md for the corresponding Samba Wiki setup.
#   - name: profiles
#     path: /srv/samba/profiles
#     owner: root
#     group: 'EXAMPLE\Unix Admins'
#     mode: '0770'
#     acls: []
#     options:
#       read only: false
#       csc policy: disable
#       recycle:repository: '%U/.recycle'
#
#   # Group drive: \\fileserver\Projects, with reader and writer AD groups.
#   # Access ACLs apply to the root; default ACLs are inherited by new contents and .recycle.
#   - name: Projects
