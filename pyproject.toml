[project]
name = "samba_ad_member"
version = "0.0.0"
description = "Join Samba AD members with winbind, RFC2307 identity mapping, and managed file shares."
authors = ["Jonas Mauer"]
license = "MIT"
keywords = ["samba", "activedirectory", "winbind", "fileserver", "rfc2307"]
repository = "https://github.com/jomrr/ansible-role-samba_ad_member"

[tool.commitizen]
name = "cz_conventional_commits"

[tool.semantic_release]
branch = "main"
commit_message = "build(release): version {version}"
major_on_zero = true
upload_to_pypi = false
upload_to_vcs_release = true
tag_format = "v{version}"
version_toml = [
    "pyproject.toml:project.version",
]

[tool.tox]
envlist = ["lint"]

[tool.tox.env.lint]
description = "Lint code"
skip_install = true
deps = ["ansible-lint"]
commands = [["ansible-lint", "--offline"]]
