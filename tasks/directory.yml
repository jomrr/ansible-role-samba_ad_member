---
# role: samba_ad_member
# file: tasks/directory.yml

- name: SAMBA_AD_MEMBER | Create the static share root
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ __samba_ad_member_share.path | regex_replace('/[^/]*%.*$', '') }}"
    state: directory
    owner: "{{ __samba_ad_member_share.owner | default(samba_ad_member_share_owner) }}"
    group: "{{ __samba_ad_member_share.group | default(samba_ad_member_share_group) }}"
    mode: "{{ __samba_ad_member_share.mode | default(samba_ad_member_share_mode) }}"
  register: __samba_ad_member_directory

- name: SAMBA_AD_MEMBER | Manage directory access and inheritance
  become: true
  become_user: root
  ansible.posix.acl:
    path: "{{ __samba_ad_member_directory.path }}"
    entity: "{{ __samba_ad_member_acl.entity | default(omit) }}"
    etype: "{{ __samba_ad_member_acl.etype }}"
    permissions: "{{ __samba_ad_member_acl.permissions | default(omit) }}"
    default: "{{ __samba_ad_member_acl.default | default(omit) }}"
    state: "{{ __samba_ad_member_acl.state | default('present') }}"
    recalculate_mask: no_mask
  loop: "{{ __samba_ad_member_share.acls | default(samba_ad_member_share_acls) }}"
  loop_control:
    loop_var: __samba_ad_member_acl
    label: "{{ __samba_ad_member_acl.etype }}:{{ __samba_ad_member_acl.entity | default('') }}"

- name: SAMBA_AD_MEMBER | Persist the shared directory SELinux context
  become: true
  become_user: root
  community.general.sefcontext:
    target: "{{ __samba_ad_member_directory.path | regex_escape }}(/.*)?"
    setype: "{{ __samba_ad_member_share.setype | default(samba_ad_member_share_setype) }}"
    state: present
  when: ansible_facts.selinux.status == 'enabled'
  notify: relabel shared directories

- name: SAMBA_AD_MEMBER | Apply the directory SELinux label
  ansible.builtin.meta: flush_handlers
