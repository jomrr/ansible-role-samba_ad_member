---
# role: samba_ad_member
# file: tasks/configure.yml

- name: SAMBA_AD_MEMBER | Render and validate Samba configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: smb.conf.j2
    dest: "{{ __samba_ad_member_config }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: "{{ __samba_ad_member_validate }}"
  notify:
    - synchronize machine keytab
    - restart winbind
    - restart samba

- name: SAMBA_AD_MEMBER | Disable the unused NetBIOS name service
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: "{{ __samba_ad_member_nmb_service }}"
    state: stopped
    enabled: false
    masked: true

- name: SAMBA_AD_MEMBER | Configure the winbind PAM module
  become: true
  become_user: root
  ansible.builtin.template:
    src: pam_winbind.conf.j2
    dest: /etc/security/pam_winbind.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
