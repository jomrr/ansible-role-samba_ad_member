---
# role: samba_ad_member
# file: vars/RedHat.yml

__samba_ad_member_packages:
  - samba
  - samba-gpupdate
  - samba-common-tools
  - samba-winbind
  - samba-winbind-clients
  - python3-samba
  - krb5-workstation
  - acl
  - policycoreutils-python-utils
__samba_ad_member_nsswitch_sources: []
__samba_ad_member_smb_service: smb
__samba_ad_member_nmb_service: nmb
__samba_ad_member_winbind_service: winbind
__samba_ad_member_config: /etc/samba/smb.conf
__samba_ad_member_validate: /usr/bin/testparm --suppress-prompt %s
__samba_ad_member_restorecon: /usr/sbin/restorecon
__samba_ad_member_krb5_ccache: 'KEYRING:persistent:%{uid}'
