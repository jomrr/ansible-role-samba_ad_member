---
# role: samba_ad_member
# file: molecule/resources/playbooks/side_effect.yml

- name: SAMBA_AD_MEMBER | Verify share updates and data preservation
  hosts: samba_ad_member_members
  gather_facts: true
  tasks:
    - name: SAMBA_AD_MEMBER | Rotate the machine password through winbind
      become: true
      become_user: root
      ansible.builtin.command: wbinfo --change-secret
      changed_when: true

    - name: SAMBA_AD_MEMBER | Verify keytab authentication after password rotation
      ansible.builtin.import_tasks: ../tasks/keytab.yml

    - name: SAMBA_AD_MEMBER | Remove the keytab from an existing member
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/krb5.keytab
        state: absent

    - name: Resolve the replacement login group's SID
      ansible.builtin.command:
        argv: [wbinfo, --name-to-sid, 'EXAMPLE\File Readers']
      register: __samba_ad_member_replacement_login_group
      changed_when: false
      failed_when: __samba_ad_member_replacement_login_group.rc != 0

    - name: Restore the keytab and change account groups using a SID
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        samba_ad_member_login_groups: "{{ [__samba_ad_member_replacement_login_group.stdout.split()[0]] }}"

    - name: Verify changed account groups take effect for ticket logins
      ansible.builtin.include_tasks: ../tasks/gssapi.yml
      loop:
        - {user: writer, allowed: false}
        - {user: reader, allowed: true}
      loop_control:
        loop_var: __samba_ad_member_login
        label: "{{ __samba_ad_member_login.user }}"

    - name: SAMBA_AD_MEMBER | Verify authentication with the restored keytab
      ansible.builtin.import_tasks: ../tasks/keytab.yml

    - name: SAMBA_AD_MEMBER | Revoke reader access through the role's NTACL definition
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        samba_ad_member_shares:
          - name: Departments
            path: /srv/samba/departments
            options:
              read only: false
            ntacl:
              owner: 'EXAMPLE\writer'
              group: 'EXAMPLE\File Writers'
              aces:
                - {trustee: 'EXAMPLE\writer', rights: full}
                - {trustee: 'EXAMPLE\File Writers', rights: modify}

    - name: SAMBA_AD_MEMBER | Verify revoked NTACL access is denied over SMB
      ansible.builtin.command:
        argv: [smbclient, //localhost/Departments, -U, 'EXAMPLE\reader', -c,
               'get Public/payload.txt /tmp/member-ntacl-revoked.txt']
      environment:
        PASSWD: "{{ __samba_ad_member_test_password }}"
      register: __samba_ad_member_ntacl_revoked
      changed_when: false
      failed_when: >-
        __samba_ad_member_ntacl_revoked.rc == 0 or
        'NT_STATUS_ACCESS_DENIED' not in __samba_ad_member_ntacl_revoked.stdout
      no_log: true

    - name: SAMBA_AD_MEMBER | Verify writer access and data survive the NTACL update
      ansible.builtin.command:
        argv: [smbclient, //localhost/Departments, -U, 'EXAMPLE\writer', -c,
               'get Public/payload.txt /tmp/member-ntacl-updated.txt']
      environment:
        PASSWD: "{{ __samba_ad_member_test_password }}"
      changed_when: false
      no_log: true

    - name: SAMBA_AD_MEMBER | Compare content after the NTACL update
      ansible.builtin.command: cmp /tmp/member-payload.txt /tmp/member-ntacl-updated.txt
      changed_when: false

    - name: Replace the published shares and restore default global options
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        samba_ad_member_global_options: {}
        samba_ad_member_login_groups: []
        samba_ad_member_shares:
          - name: Archive
            path: /srv/samba/projects
            options:
              valid users: '@"EXAMPLE\File Readers" @"EXAMPLE\File Writers"'
            mode: '2770'
            acls:
              - {etype: group, entity: 'EXAMPLE\File Readers', state: absent}
              - {etype: group, entity: 'EXAMPLE\File Readers', default: true, state: absent}

    - name: Verify disabling account restrictions permits a ticket holder outside the password group
      ansible.builtin.include_tasks: ../tasks/gssapi.yml
      loop:
        - {user: outsider, allowed: true}
      loop_control:
        loop_var: __samba_ad_member_login
        label: "{{ __samba_ad_member_login.user }}"

    - name: SAMBA_AD_MEMBER | Read existing data through the replacement share
      ansible.builtin.command:
        argv:
          - smbclient
          - //localhost/Archive
          - -U
          - 'EXAMPLE\writer'
          - -c
          - get inherited/payload.txt /tmp/member-archive.txt
      environment:
        PASSWD: "{{ __samba_ad_member_test_password }}"
      changed_when: false
      no_log: true

    - name: SAMBA_AD_MEMBER | Compare preserved data
      ansible.builtin.command: cmp /tmp/member-payload.txt /tmp/member-archive.txt
      changed_when: false

    - name: Verify the replacement share is audited in the default log file
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - grep
          - --extended-regexp
          - 'samba_audit\|.*writer\|.*\|Archive\|connect\|ok\|'
          - /var/log/samba/log.samba
      register: __samba_ad_member_restored_log
      changed_when: false
      failed_when: __samba_ad_member_restored_log.rc != 0

    - name: SAMBA_AD_MEMBER | Check that removed shares are unpublished
      ansible.builtin.command:
        argv: [smbclient, //localhost/Projects, -U, 'EXAMPLE\writer', -c, ls]
      environment:
        PASSWD: "{{ __samba_ad_member_test_password }}"
      register: __samba_ad_member_removed
      changed_when: false
      failed_when: >-
        __samba_ad_member_removed.rc == 0 or
        'NT_STATUS_BAD_NETWORK_NAME' not in __samba_ad_member_removed.stdout
      no_log: true

    - name: SAMBA_AD_MEMBER | Verify revoked POSIX access is also denied over SMB
      ansible.builtin.command:
        argv: [smbclient, //localhost/Archive, -U, 'EXAMPLE\reader', -c,
               'get inherited/payload.txt /tmp/member-revoked.txt']
      environment:
        PASSWD: "{{ __samba_ad_member_test_password }}"
      register: __samba_ad_member_smb_revoked
      changed_when: false
      failed_when: >-
        __samba_ad_member_smb_revoked.rc == 0 or
        'NT_STATUS_ACCESS_DENIED' not in __samba_ad_member_smb_revoked.stdout
      no_log: true

    - name: SAMBA_AD_MEMBER | Check that the revoked directory ACL denies traversal
      become: true
      become_user: root
      ansible.builtin.command:
        argv: [runuser, -u, 'EXAMPLE\reader', --, cat, /srv/samba/projects/inherited/payload.txt]
      register: __samba_ad_member_revoked
      changed_when: false
      failed_when: __samba_ad_member_revoked.rc == 0 or 'Permission denied' not in __samba_ad_member_revoked.stderr
